# yc.holm.team behind Holm ID, edge SSO pattern (same as ntfy/music).
# The edge gateway checks every request with the Authentik embedded outpost
# (shared provider "Holm edge forward auth", holm-admins only) before it
# reaches the site. No per-app OIDC client and no oauth2-proxy.
# Playbook: holm-id-playbook.md (workspace) - Pattern A.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yc
  namespace: yc
spec:
  parentRefs:
    - name: edge
      namespace: edge
      sectionName: yc
  hostnames: [yc.holm.team]
  rules:
    - backendRefs:
        - name: yc
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: yc-sso
  namespace: yc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: yc
  extAuth:
    failOpen: false
    headersToExtAuth:
      - X-Forwarded-Proto
      - Authorization
      - Proxy-Authorization
      - Accept
      - Cookie
    http:
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
